<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کیوار کد فشرده</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.4.4/libs/lz-string.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 28px 24px 32px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 60px rgba(0, 20, 30, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0b2b3d;
            text-align: center;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: -0.3px;
        }
        h1 small {
            font-size: 13px;
            font-weight: 400;
            color: #2c6e8a;
            background: rgba(44, 110, 138, 0.12);
            padding: 2px 12px;
            border-radius: 20px;
        }
        textarea {
            width: 100%;
            height: 110px;
            padding: 14px 16px;
            border: 2px solid #dde5ed;
            border-radius: 16px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            background: #ffffff;
            transition: border 0.25s, box-shadow 0.25s;
            color: #0b2b3d;
        }
        textarea:focus {
            border-color: #2c6e8a;
            box-shadow: 0 0 0 4px rgba(44, 110, 138, 0.13);
        }
        textarea::placeholder {
            color: #8aa3b5;
            font-size: 14px;
        }
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            margin: 14px 0 10px;
            padding: 12px 16px;
            background: #eef3f8;
            border-radius: 14px;
            font-size: 13px;
            color: #1a4052;
            justify-content: space-between;
            align-items: center;
        }
        .stats .label {
            font-weight: 500;
            opacity: 0.75;
        }
        .stats .val {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .stats .val.green {
            color: #0f7b4a;
        }
        .stats .val.red {
            color: #b13e3e;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: #1f5a73;
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 6px;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover {
            background: #164a60;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .qr-wrap {
            margin-top: 20px;
            padding: 16px;
            background: #fafcff;
            border-radius: 18px;
            border: 2px dashed #cbd8e4;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 180px;
            justify-content: center;
            transition: border-color 0.3s;
        }
        .qr-wrap.has-qr {
            border-color: #2c6e8a;
            border-style: solid;
        }
        #qrcode canvas,
        #qrcode img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
        .qr-info {
            font-size: 12.5px;
            color: #1a4052;
            text-align: center;
            margin-top: 10px;
            background: #e8f0f6;
            padding: 8px 16px;
            border-radius: 30px;
            word-break: break-all;
            max-width: 100%;
            display: none;
        }
        .qr-info.show {
            display: block;
        }
        .qr-info b {
            color: #0b2b3d;
        }
        .foot {
            margin-top: 14px;
            font-size: 11.5px;
            color: #5f7e92;
            text-align: center;
            opacity: 0.8;
            border-top: 1px solid #e0e9f0;
            padding-top: 14px;
        }
        .badge {
            background: #d4e2ed;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 11px;
            color: #1a4052;
        }
        @media (max-width: 480px) {
            .box {
                padding: 20px 16px 24px;
            }
            h1 {
                font-size: 19px;
            }
            textarea {
                height: 90px;
                font-size: 14px;
            }
            .stats {
                font-size: 12px;
                padding: 10px 12px;
                flex-wrap: wrap;
            }
            .btn {
                font-size: 15px;
                padding: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>
            📱 کیوار کد فشرده
            <small>LZ</small>
        </h1>

        <textarea id="inp" placeholder="متن خود را وارد کنید … (هر چه طولانی‌تر، فشرده‌سازی موثرتر)"></textarea>

        <div class="stats">
            <span><span class="label">📄 اصلی</span> <span class="val" id="origSize">0</span></span>
            <span><span class="label">📦 فشرده</span> <span class="val green" id="compSize">0</span></span>
            <span><span class="label">⚡ نرخ</span> <span class="val" id="ratio">—</span></span>
        </div>

        <button class="btn" id="genBtn">✨ تولید کیوار کد فشرده</button>

        <div class="qr-wrap" id="qrWrap">
            <div id="qrcode"></div>
            <div class="qr-info" id="qrInfo"></div>
        </div>

        <div class="foot">
            <span class="badge">🔐 فشرده‌سازی LZ + Base64</span>
            &nbsp;·&nbsp; حجم کمتر، کیوار کد کوچک‌تر
        </div>
    </div>

    <script>
        (function() {
            // --- DOM refs ---
            const inp = document.getElementById('inp');
            const origSizeEl = document.getElementById('origSize');
            const compSizeEl = document.getElementById('compSize');
            const ratioEl = document.getElementById('ratio');
            const genBtn = document.getElementById('genBtn');
            const qrContainer = document.getElementById('qrcode');
            const qrWrap = document.getElementById('qrWrap');
            const qrInfo = document.getElementById('qrInfo');

            let currentQR = null; // hold QRCode instance

            // --- helpers ---
            function fmt(n) {
                return n.toLocaleString();
            }

            function updateStats() {
                const raw = inp.value;
                const rawLen = raw.length;
                origSizeEl.textContent = fmt(rawLen);

                if (rawLen === 0) {
                    compSizeEl.textContent = '0';
                    ratioEl.textContent = '—';
                    return;
                }

                try {
                    const compressed = LZString.compressToBase64(raw);
                    const compLen = compressed.length;
                    compSizeEl.textContent = fmt(compLen);

                    const pct = ((1 - compLen / rawLen) * 100);
                    const display = pct > 0 ? pct.toFixed(1) : pct.toFixed(1);
                    ratioEl.textContent = (pct > 0 ? '−' : '+') + Math.abs(display) + '%';
                    ratioEl.style.color = pct > 0 ? '#0f7b4a' : '#b13e3e';
                } catch (_) {
                    compSizeEl.textContent = '?';
                    ratioEl.textContent = '—';
                }
            }

            // --- generate QR ---
            function generate() {
                const raw = inp.value.trim();
                if (!raw) {
                    alert('لطفاً متنی وارد کنید.');
                    return;
                }

                let compressed;
                try {
                    compressed = LZString.compressToBase64(raw);
                } catch (e) {
                    alert('خطا در فشرده‌سازی متن. لطفاً دوباره تلاش کنید.');
                    return;
                }

                // clear previous QR
                if (currentQR) {
                    try { currentQR.clear(); } catch (_) {}
                    currentQR = null;
                }
                qrContainer.innerHTML = '';

                // show generating state
                genBtn.disabled = true;
                genBtn.textContent = '⏳ در حال تولید …';

                // generate QR with compressed text
                const size = Math.min(280, Math.max(180, window.innerWidth < 480 ? 220 : 280));
                try {
                    currentQR = new QRCode(qrContainer, {
                        text: compressed,
                        width: size,
                        height: size,
                        colorDark: '#0b2b3d',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H // highest error correction
                    });
                } catch (e) {
                    alert('خطا در تولید کیوار کد: ' + e.message);
                    genBtn.disabled = false;
                    genBtn.textContent = '✨ تولید کیوار کد فشرده';
                    return;
                }

                // show compressed info
                const rawLen = raw.length;
                const compLen = compressed.length;
                const saved = rawLen - compLen;
                const pct = rawLen > 0 ? ((1 - compLen / rawLen) * 100) : 0;
                const sign = pct > 0 ? '−' : '+';

                qrInfo.innerHTML =
                    '📦 متن فشرده شده: <b>' + fmt(compLen) + '</b> کاراکتر ' +
                    '(صرفه‌جویی: <b>' + sign + Math.abs(pct).toFixed(1) + '%</b> ، ' +
                    fmt(Math.abs(saved)) + ' کاراکتر)';
                qrInfo.classList.add('show');
                qrWrap.classList.add('has-qr');

                genBtn.disabled = false;
                genBtn.textContent = '✨ تولید کیوار کد فشرده';

                // store compressed text as data attribute for possible copy
                qrWrap.dataset.compressed = compressed;
            }

            // --- input event: live stats ---
            inp.addEventListener('input', updateStats);

            // --- generate button ---
            genBtn.addEventListener('click', generate);

            // --- initial stats ---
            updateStats();

            // --- auto-generate on Ctrl+Enter (or Cmd+Enter) ---
            inp.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    generate();
                }
            });

            // --- if textarea has content on load, show stats (but don't auto-gen) ---
            // (nothing extra needed)

            // --- responsive: rebuild QR on resize if exists ---
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    if (currentQR && qrWrap.dataset.compressed) {
                        // rebuild with new size
                        const text = qrWrap.dataset.compressed;
                        if (!text) return;
                        const size = Math.min(280, Math.max(180, window.innerWidth < 480 ? 220 : 280));
                        try {
                            currentQR.clear();
                            currentQR = null;
                            qrContainer.innerHTML = '';
                            currentQR = new QRCode(qrContainer, {
                                text: text,
                                width: size,
                                height: size,
                                colorDark: '#0b2b3d',
                                colorLight: '#ffffff',
                                correctLevel: QRCode.CorrectLevel.H
                            });
                        } catch (_) {}
                    }
                }, 400);
            });

            // --- optional: click on QR to copy compressed text (nice to have) ---
            qrWrap.addEventListener('click', function(e) {
                // ignore if click on button or inside info
                if (e.target.closest('.btn') || e.target.closest('.qr-info')) return;
                const compressed = qrWrap.dataset.compressed;
                if (!compressed) return;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(compressed).then(() => {
                        const old = qrInfo.innerHTML;
                        qrInfo.innerHTML = '✅ متن فشرده در کلیپ‌بورد کپی شد!';
                        setTimeout(() => { qrInfo.innerHTML = old; }, 1800);
                    }).catch(() => {});
                }
            });

            console.log('✅ QR Compressor ready — حجم کم، فشرده‌سازی LZ');
        })();
    </script>

</body>
</html>
